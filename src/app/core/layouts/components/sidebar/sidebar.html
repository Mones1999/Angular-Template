<aside class="sidebar" [class.collapsed]="collapsed()" role="navigation" aria-label="Main navigation">
    <!-- Brand -->
    <div class="brand-section">
        <div class="flex items-center gap-2.5 overflow-hidden">
            <img src="assets\icons\globitel-logo.png" width="110px" />
        </div>
        <!-- Mobile close -->
        <button
            class="sidebar-close-btn lg:hidden flex items-center justify-center w-8 h-8 rounded-lg text-white/60 hover:text-white hover:bg-white/10 transition-colors"
            (click)="closeSidebar()" [attr.aria-label]="'Close sidebar'">
            <i class="pi pi-times text-sm"></i>
        </button>
        <!-- Desktop collapse toggle -->
        <button pRipple (click)="toggleCollapse()"
            class="collapse-toggle-btn hidden lg:flex items-center justify-center w-8 h-8 rounded-lg text-white/60 hover:text-white hover:bg-white/10 transition-colors border-0 bg-transparent cursor-pointer"
            [attr.aria-label]="'Toggle sidebar'">
            <i class="pi text-sm" [class.pi-chevron-left]="!collapsed()" [class.pi-chevron-right]="collapsed()"></i>
        </button>
    </div>

    <!-- User Profile -->
    <div class="user-profile-card mx-3 mb-4 rounded-xl bg-[#304073]" [class.collapsed-profile]="collapsed()">
        <div class="flex items-center gap-3 px-3 py-3">
            <p-avatar icon="pi pi-user" [size]="collapsed() ? 'normal' : 'large'" shape="circle"
                [pt]="{ root: { class: 'bg-white/20 text-white flex-shrink-0' } }" />
            <div class="user-info flex flex-col min-w-0">
                <span class="text-sm font-semibold text-white truncate">{{ 'sidebar.user.name' | translate }}</span>
                <span class="text-xs text-white/50 truncate">{{ 'sidebar.user.role' | translate }}</span>
            </div>
        </div>
    </div>

    <!-- Navigation Groups -->
    <nav class="flex-1 overflow-y-auto px-3 sidebar-scroll">
        @for (group of menuGroups; track group.label) {
        <div class="mb-4">
            <span
                class="group-label block px-3 mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-white/40">
                {{ group.label }}
            </span>
            @if (collapsed()) {
            <div class="collapsed-divider mx-3 mb-1.5 border-t border-white/15"></div>
            }
            <ul class="space-y-0.5" role="list">
                @for (item of group.items; track item.route) {
                <li>
                    <a [routerLink]="item.route" routerLinkActive="nav-item-active" pRipple
                        class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-lg text-white/70 hover:text-white hover:bg-white/8 transition-all duration-200 cursor-pointer no-underline"
                        [class.justify-center]="collapsed()" [attr.aria-label]="item.label"
                        [pTooltip]="collapsed() ? item.label : ''" tooltipPosition="right" (click)="closeSidebar()">
                        <i [class]="item.icon" class="text-base w-5 text-center flex-shrink-0"></i>
                        <span class="nav-label text-sm font-medium">{{ item.label }}</span>
                    </a>
                </li>
                }
            </ul>
        </div>
        }
    </nav>

    <!-- Bottom Actions -->
    <div class="px-3 pb-3 pt-2 border-t border-white/10 mt-auto">
        <button pRipple (click)="authService.logout()"
            class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-red-300 hover:text-white hover:bg-red-500/20 transition-all duration-200 cursor-pointer border-0 bg-transparent text-left"
            [class.justify-center]="collapsed()" [pTooltip]="collapsed() ? ('sidebar.logout' | translate) : ''"
            tooltipPosition="right" aria-label="Logout">
            <i class="pi pi-sign-out text-base w-5 text-center flex-shrink-0"></i>
            <span class="nav-label text-sm font-medium">{{ 'sidebar.logout' | translate }}</span>
        </button>
    </div>
</aside>
