<div class="not-found-container">
    <div class="not-found-content">
        <div class="error-visual">
            <span class="digit">4</span>
            <div class="circle-icon">
                <i class="pi pi-compass"></i>
            </div>
            <span class="digit">4</span>
        </div>

        <h2 class="title">{{ 'not_found.title' | translate }}</h2>
        <p class="description">{{ 'not_found.description' | translate }}</p>

        <div class="actions">
            <p-button [label]="'common.go_to_home' | translate" icon="pi pi-home" [routerLink]="homeRoute"
                severity="primary" size="large" styleClass="home-btn">
            </p-button>
        </div>
    </div>
</div>
